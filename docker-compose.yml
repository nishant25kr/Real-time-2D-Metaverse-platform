services:
  http:
    build:
      context: .
      dockerfile: Dockerfile.http
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_PASSWORD: ${JWT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  ws:
    build:
      context: .
      dockerfile: Dockerfile.ws
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_PASSWORD: ${JWT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:3000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8080}
    ports:
      - "5173:80"
    depends_on:
      - http
      - ws

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metaverse
      POSTGRES_PASSWORD: metaverse
      POSTGRES_DB: metaverse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metaverse -d metaverse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
