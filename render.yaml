# Render Blueprint: HTTP + WebSocket + PostgreSQL
# Deploy: Render Dashboard → New → Blueprint → select this file

databases:
  - name: meta-verse-db
    plan: free
    databaseName: metaverse
    user: metaverse

services:
  - type: web
    name: meta-verse-http
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:http
    startCommand: npm run start --workspace=http
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meta-verse-db
          property: connectionString
      - key: JWT_PASSWORD
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: NODE_ENV
        value: production

  - type: web
    name: meta-verse-ws
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:ws
    startCommand: npm run start --workspace=meta-verse-ws
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meta-verse-db
          property: connectionString
      - key: JWT_PASSWORD
        fromService:
          name: meta-verse-http
          type: web
          envVarKey: JWT_PASSWORD
      - key: NODE_ENV
        value: production
