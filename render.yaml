# Render Blueprint: HTTP + WebSocket + PostgreSQL
# Deploy: connect this repo in Render Dashboard → New → Blueprint → select render.yaml

databases:
  - name: meta-verse-db
    plan: free
    databaseName: metaverse
    user: metaverse

services:
  - type: web
    name: meta-verse-http
    runtime: docker
    dockerfilePath: ./Dockerfile.http
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meta-verse-db
          property: connectionString
      - key: JWT_PASSWORD
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: NODE_ENV
        value: production

  - type: web
    name: meta-verse-ws
    runtime: docker
    dockerfilePath: ./Dockerfile.ws
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meta-verse-db
          property: connectionString
      - key: JWT_PASSWORD
        fromService:
          name: meta-verse-http
          type: web
          envVarKey: JWT_PASSWORD
      - key: NODE_ENV
        value: production
